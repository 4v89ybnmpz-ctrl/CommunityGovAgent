name: issue-gov tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install "ruff>=0.17,<0.18"
      - name: Run ruff
        run: ruff check common issue-gov-agent/issue_gov scripts

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: issue
          POSTGRES_PASSWORD: issue
          POSTGRES_DB: issue_gov_test
        ports:
          - 5432:5432
        # 连接就绪探针：pg_isready 成功前不启动测试步骤。
        options: >-
          --health-cmd "pg_isready -U issue -d issue_gov_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PG_TEST_DATABASE_URL: postgresql://issue:issue@127.0.0.1:5432/issue_gov_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install third-party dependencies
        # 锁文件与镜像构建使用同一组版本；本地开发仍可用 requirements.txt 取最新兼容版。
        run: python -m pip install -r issue-gov-agent/requirements.lock
      - name: Run unit tests (SQLite + PostgreSQL paths)
        working-directory: issue-gov-agent
        run: python -m unittest discover -s tests
