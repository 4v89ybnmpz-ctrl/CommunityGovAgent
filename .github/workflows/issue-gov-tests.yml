name: issue-gov tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install third-party dependencies
        run: python -m pip install -r issue-gov-agent/requirements.txt
      - name: Run unit tests
        working-directory: issue-gov-agent
        run: python -m unittest discover -s tests
