[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "govcommon"
version = "0.1.0"
description = "Queue, database, and platform client shared inside this repository."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["govcommon*"]
